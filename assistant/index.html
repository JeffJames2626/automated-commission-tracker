<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Assistant</title>
<meta name="description" content="Capture anything. Ask about everything.">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<script src="theme.js"></script>
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistant">
<meta name="referrer" content="same-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body class="signed-out">
<div class="app">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <main class="main" id="main" tabindex="-1"><div class="boot-splash"><img src="icons/icon.svg" alt="" width="56" height="56"></div></main>
  <aside class="context" id="context" aria-label="Sources and context"></aside>
</div>
<button class="fab" id="fab" aria-label="Capture" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<button class="net-pill" id="net" hidden></button>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
